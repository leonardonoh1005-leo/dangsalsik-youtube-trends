name: Daily Health Trends Collector

on:
  schedule:
    # 매일 한국시간 오전 6시 55분 (UTC 21:55)
    - cron: '55 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run YouTube health trends script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 fetch_health_trends.py

      - name: Commit and push updated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_report.md reports/
          if git diff --staged --quiet; then
            echo "변경된 리포트가 없습니다."
          else
            git commit -m "chore: update daily health trends report"
            git push
          fi
